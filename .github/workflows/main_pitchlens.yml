# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - pitchlens

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: deploy-pitchlens
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install, build and test
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build
          npm test

      # One zip keeps the hidden .next build output (upload-artifact skips
      # hidden files) and node_modules exactly as built. App Service must not
      # rebuild it: SCM_DO_BUILD_DURING_DEPLOYMENT=false on the web app.
      - name: Package the built app
        run: zip -r -y -q release.zip . -x ".git/*" ".github/*" ".next/cache/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_35F113E9547E43B6AC100F185B2D7BFF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FCAB341ACFAA44F38C835CA4094099EE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_320954CE41DC4DF58878C86F3D50395E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pitchlens'
          slot-name: 'Production'
          package: release.zip
          