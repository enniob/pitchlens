<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PitchLens intro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1622; --s1:#111e2b; --s2:#172636; --line:#22364a; --text:#eef3f8; --muted:#93a6b8; --accent:#34d3a4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .pitch { position: absolute; inset: 0; opacity: 0; animation: fade 1.6s ease-out .1s forwards; }
  .pitch svg { width: 100%; height: 100%; }
  .glow { position: absolute; width: 1100px; height: 1100px; left: 50%; top: 46%; transform: translate(-50%,-50%);
          background: radial-gradient(circle, rgba(52,211,164,.16), rgba(52,211,164,0) 62%); }
  .card { position: relative; text-align: center; margin-top: -90px; }
  .mark { display: inline-flex; align-items: center; gap: 30px; opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .35s forwards; }
  .mark svg { width: 120px; height: 120px; }
  .word { font-size: 148px; font-weight: 800; letter-spacing: -4px; }
  .word b { color: var(--accent); font-weight: 800; }
  .tag { margin-top: 18px; font-size: 50px; font-weight: 600; color: var(--text); opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) 1.0s forwards; }
  .sub { margin-top: 14px; font-size: 30px; color: var(--muted); opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) 1.4s forwards; }
  .chips { margin-top: 46px; display: flex; gap: 16px; justify-content: center; }
  .chip { padding: 14px 26px; border: 1px solid var(--line); background: var(--s1); border-radius: 999px; font-size: 26px; font-weight: 600; color: var(--text);
          opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .chip i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-right: 12px; vertical-align: 2px; }
  .chip:nth-child(1) { animation-delay: 2.0s } .chip:nth-child(2) { animation-delay: 2.25s } .chip:nth-child(3) { animation-delay: 2.5s } .chip:nth-child(4) { animation-delay: 2.75s }
  .credits { margin-top: 22px; } .credits .chip { border-color: rgba(52,211,164,.45); }
  .credits .chip:nth-child(1) { animation-delay: 3.1s } .credits .chip:nth-child(2) { animation-delay: 3.35s }
  .foot { position: absolute; left: 0; right: 0; bottom: 170px; text-align: center; font-size: 24px; color: var(--muted); letter-spacing: .5px;
          opacity: 0; animation: fade 1s ease-out 3.7s forwards; }
  .foot strong { color: var(--accent); font-weight: 600; letter-spacing: 3px; text-transform: uppercase; font-size: 20px; margin-right: 14px; }
  .url { margin-top: 40px; font-size: 32px; font-weight: 600; color: var(--accent); opacity: 0; animation: rise .8s ease-out 2.4s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) } to { opacity: 1; transform: none } }
  @keyframes fade { to { opacity: 1 } }
</style>
</head>
<body>
<div class="stage">
  <div class="pitch">
    <svg viewBox="0 0 1920 1080" fill="none" stroke="#34d3a4" stroke-opacity=".09" stroke-width="3">
      <rect x="120" y="90" width="1680" height="900" rx="4"/>
      <line x1="960" y1="90" x2="960" y2="990"/>
      <circle cx="960" cy="540" r="150"/>
      <rect x="120" y="300" width="250" height="480"/><rect x="1550" y="300" width="250" height="480"/>
      <rect x="120" y="420" width="90" height="240"/><rect x="1710" y="420" width="90" height="240"/>
    </svg>
  </div>
  <div class="glow"></div>

  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#34d3a4" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/>
        <line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/>
      </svg>
      <span class="word">Pitch<b>Lens</b></span>
    </div>

    <div class="intro">
      <div class="tag">Explainable match intelligence</div>
      <div class="sub">Why a moment matters, with evidence you can replay</div>
      <div class="chips">
        <span class="chip"><i></i>Interactive 3D playback</span>
        <span class="chip"><i></i>Casual Fan &amp; Analyst</span>
        <span class="chip"><i></i>Time-bounded evidence</span>
      </div>
      <div class="chips credits">
        <span class="chip"><i></i>Explanations: Microsoft Foundry</span>
        <span class="chip"><i></i>Narration: Microsoft MAI-Voice-2.1</span>
      </div>
    </div>
  </div>

  <div class="foot"><strong>Synthetic data</strong>All teams, players and match events are fictional</div>
</div>
</body>
</html>
